[project]
name = "heli-server"
version = "0.1.0"
description = "Heli bot orchestrator"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "arq>=0.26",
  "cryptography>=43",
  "fastapi>=0.115",
  "httpx>=0.27",
  "openai>=1.55",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.6",
  "pyjwt>=2.10",
  "redis>=5",
  "sqlalchemy>=2.0",
  "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
cloud = ["playwright==1.49.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "evals*"]

[tool.setuptools.package-data]
evals = ["*.json", "scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --tb=short"
