# Heli bot on a shared host: isolated project, no published host ports.
# Attach `api` to the existing reverse-proxy Docker network via HELI_PROXY_NETWORK.

name: heli-bot

services:
  api:
    build:
      context: ../../server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      PORT: "8000"
      DATABASE_URL: postgresql+psycopg://heli:${POSTGRES_PASSWORD}@postgres:5432/heli
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      heli_internal:
      heli_proxy:
        aliases:
          - heli-bot-api
    mem_limit: 768m
    cpus: "1.0"
    pids_limit: 256

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: heli
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: heli
    volumes:
      - heli_pgdata:/var/lib/postgresql/data
    networks:
      - heli_internal
    mem_limit: 1536m
    cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heli -d heli"]
      interval: 10s
      timeout: 5s
      retries: 12
    pids_limit: 256

networks:
  heli_internal:
    name: heli-bot-internal
  heli_proxy:
    external: true
    name: ${HELI_PROXY_NETWORK}

volumes:
  heli_pgdata:
    name: heli-bot-pgdata
