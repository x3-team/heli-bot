[package]
name = "heli-desktop"
version = "0.1.0"
edition = "2021"
description = "Heli bot desktop shell"
publish = false

[lib]
name = "heli_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
local-agent = { path = "../../../crates/local-agent", features = ["os"] }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
