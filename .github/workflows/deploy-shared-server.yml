name: deploy-shared-server

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/deploy/**"
      - ".github/workflows/deploy-shared-server.yml"
      - "server/Dockerfile"
      - "server/docker-entrypoint.sh"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate production compose
        env:
          HELI_PROXY_NETWORK: ci-validate-placeholder
          POSTGRES_PASSWORD: ci-validate-placeholder
        run: docker compose -f infra/deploy/docker-compose.prod.yml config --quiet

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server
        run: python -m pip install -e "./server[dev]"
      - name: Test
        env:
          HELI_API_KEY: ${{ secrets.HELI_API_KEY }}
        run: python -m pytest server/tests

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, server-tests]
    runs-on: ubuntu-latest
    concurrency:
      group: heli-shared-server-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HELI_DEPLOY_SSH_HOST }}
          username: ${{ secrets.HELI_DEPLOY_SSH_USER }}
          key: ${{ secrets.HELI_DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HELI_DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            mkdir -p "${{ secrets.HELI_DEPLOY_APP_DIR }}/infra/deploy"
            mkdir -p "${{ secrets.HELI_DEPLOY_APP_DIR }}/server"

      - name: Sync server and deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HELI_DEPLOY_SSH_HOST }}
          username: ${{ secrets.HELI_DEPLOY_SSH_USER }}
          key: ${{ secrets.HELI_DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HELI_DEPLOY_SSH_PORT || 22 }}
          source: "server,infra/deploy"
          target: ${{ secrets.HELI_DEPLOY_APP_DIR }}
          strip_components: 0
          overwrite: true

      - name: Build and start containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HELI_DEPLOY_SSH_HOST }}
          username: ${{ secrets.HELI_DEPLOY_SSH_USER }}
          key: ${{ secrets.HELI_DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HELI_DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            cd "${{ secrets.HELI_DEPLOY_APP_DIR }}"
            test -f "${{ secrets.HELI_DEPLOY_ENV_FILE }}"
            docker compose -f infra/deploy/docker-compose.prod.yml \
              --env-file "${{ secrets.HELI_DEPLOY_ENV_FILE }}" \
              up -d --build --remove-orphans
            docker compose -f infra/deploy/docker-compose.prod.yml \
              --env-file "${{ secrets.HELI_DEPLOY_ENV_FILE }}" \
              ps
