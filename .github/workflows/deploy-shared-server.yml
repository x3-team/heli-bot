name: deploy-shared-server

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "infra/deploy/**"
      - ".github/workflows/deploy-shared-server.yml"
      - "server/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate deploy scripts and systemd units
        run: |
          bash -n infra/deploy/remote-install.sh
          bash -n infra/deploy/write-env-if-missing.sh
          test -f infra/deploy/systemd-user/heli-bot-api.service
          test -f infra/deploy/systemd-system/heli-bot-api.service

  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server
        run: python -m pip install -e "./server[dev]"
      - name: Test
        env:
          HELI_API_KEY: ${{ secrets.HELI_API_KEY }}
        run: python -m pytest server/tests

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [validate, server-tests]
    runs-on: ubuntu-latest
    concurrency:
      group: heli-shared-server-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Prepare remote tree
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HELI_DEPLOY_SSH_HOST }}
          username: ${{ secrets.HELI_DEPLOY_SSH_USER }}
          key: ${{ secrets.HELI_DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HELI_DEPLOY_SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -eu
            APP_DIR="${{ secrets.HELI_DEPLOY_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/opt/heli-bot"; fi
            mkdir -p "$APP_DIR/server" "$APP_DIR/infra/deploy" "$APP_DIR/var"

      - name: Sync server and deploy files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HELI_DEPLOY_SSH_HOST }}
          username: ${{ secrets.HELI_DEPLOY_SSH_USER }}
          key: ${{ secrets.HELI_DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HELI_DEPLOY_SSH_PORT || 22 }}
          source: "server,infra/deploy"
          target: /opt/heli-bot
          strip_components: 0
          overwrite: true

      - name: Install venv, migrate, and restart user service
        uses: appleboy/ssh-action@v1.2.0
        env:
          HELI_DEPLOY_JWT_SECRET: ${{ secrets.HELI_DEPLOY_JWT_SECRET }}
          HELI_DEPLOY_TRAJECTORY_HASH_PEPPER: ${{ secrets.HELI_DEPLOY_TRAJECTORY_HASH_PEPPER }}
          HELI_API_KEY: ${{ secrets.HELI_API_KEY }}
        with:
          host: ${{ secrets.HELI_DEPLOY_SSH_HOST }}
          username: ${{ secrets.HELI_DEPLOY_SSH_USER }}
          key: ${{ secrets.HELI_DEPLOY_SSH_PRIVATE_KEY }}
          port: ${{ secrets.HELI_DEPLOY_SSH_PORT || 22 }}
          debug: true
          script_stop: true
          envs: HELI_DEPLOY_JWT_SECRET,HELI_DEPLOY_TRAJECTORY_HASH_PEPPER,HELI_API_KEY
          script: |
            set -euxo pipefail
            exec 2>&1
            APP_DIR="${{ secrets.HELI_DEPLOY_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then APP_DIR="/opt/heli-bot"; fi
            ENV_FILE="${{ secrets.HELI_DEPLOY_ENV_FILE }}"
            if [ -z "$ENV_FILE" ]; then ENV_FILE="$APP_DIR/.env"; fi
            echo "[heli-deploy] APP_DIR=$APP_DIR ENV_FILE=$ENV_FILE"
            chmod +x "$APP_DIR/infra/deploy/write-env-if-missing.sh" 2>/dev/null || true
            "$APP_DIR/infra/deploy/write-env-if-missing.sh" "$ENV_FILE" "$APP_DIR"
            if [ ! -f "$ENV_FILE" ]; then
              echo "[heli-deploy] env file still missing after bootstrap" >&2
              exit 1
            fi
            if [ ! -x "$APP_DIR/infra/deploy/remote-install.sh" ] && [ -f "$APP_DIR/infra/deploy/remote-install.sh" ]; then
              chmod +x "$APP_DIR/infra/deploy/remote-install.sh"
            fi
            if ! "$APP_DIR/infra/deploy/remote-install.sh" "$APP_DIR" "$ENV_FILE"; then
              status=$?
              if [ "$status" -eq 2 ]; then
                echo "--- Admin system unit (infra/deploy/systemd-system/) ---"
                sed 's/^/# /' "$APP_DIR/infra/deploy/systemd-system/heli-bot-api.service"
                sed 's/^/# /' "$APP_DIR/infra/deploy/systemd-system/helibot.slice"
              fi
              exit "$status"
            fi
