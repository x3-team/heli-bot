name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  server:
    runs-on: [self-hosted, beget-light]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server
        run: python -m pip install -e "./server[dev]"
      - name: Test
        env:
          HELI_API_KEY: ${{ secrets.HELI_API_KEY }}
        run: python -m pytest server/tests

  web:
    runs-on: [self-hosted, beget-light]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: UI behavior
        run: pnpm --filter @heli/ui test
      - name: Build web
        run: pnpm build:web

  agent:
    runs-on: [self-hosted, beget-light]
    needs: [server, web]
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
      - name: Ensure C linker for Rust tests
        run: |
          if command -v cc >/dev/null 2>&1; then
            exit 0
          fi
          if command -v gcc >/dev/null 2>&1; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$(id -u)" -eq 0 ] && command -v apt-get >/dev/null 2>&1; then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential
            exit 0
          fi
          ver=0.13.0
          arch=$(uname -m)
          case "$arch" in
            x86_64) zarch=x86_64 ;;
            aarch64) zarch=aarch64 ;;
            *) echo "unsupported runner arch: $arch" >&2; exit 1 ;;
          esac
          root="/tmp/zig-linux-${zarch}-${ver}"
          if [ ! -x "$root/zig" ]; then
            curl -fsSL "https://ziglang.org/download/${ver}/zig-linux-${zarch}-${ver}.tar.xz" \
              | tar -xJ -C /tmp
          fi
          printf '%s\n' '#!/usr/bin/env bash' "exec \"$root/zig\" cc \"\$@\"" > /tmp/heli-zig-cc
          printf '%s\n' '#!/usr/bin/env bash' "exec \"$root/zig\" c++ \"\$@\"" > /tmp/heli-zig-cxx
          chmod +x /tmp/heli-zig-cc /tmp/heli-zig-cxx
          echo "CC=/tmp/heli-zig-cc" >> "$GITHUB_ENV"
          echo "CXX=/tmp/heli-zig-cxx" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
      - name: Point Cargo at Zig linker (self-hosted fallback)
        run: |
          if [ ! -x /tmp/heli-zig-cc ]; then
            exit 0
          fi
          host=$(rustc -vV | sed -n 's/^host: //p')
          mkdir -p .cargo
          printf '%s\n' "[target.${host}]" 'linker = "/tmp/heli-zig-cc"' > .cargo/config.toml
      - name: Test local agent
        run: cargo test --manifest-path crates/local-agent/Cargo.toml

  desktop-windows:
    name: desktop (x86_64-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: x86_64-pc-windows-msvc
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_HELI_API_BASE: https://bot-api.getheli.ru
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: heli-windows-x64
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  desktop-macos:
    if: github.event_name == 'workflow_dispatch'
    name: desktop (${{ matrix.target }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin --bundles app,dmg
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.90.0
          targets: ${{ matrix.target }}
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          VITE_HELI_API_BASE: ${{ vars.HELI_PUBLIC_API_BASE || 'https://bot-api.getheli.ru' }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: heli-macos-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
          if-no-files-found: error
