name: deploy-pinvds

# Heli bot API on pinvds (bot-api.getheli.ru, /opt/heli-bot). Manual only.
#   mode=diff    compare the running copy with this commit, change nothing (run it first:
#                the copy on the host was made by hand, not from git)
#   mode=learning-check  read-only: run journal, SFT export and /admin/quality as counts (no data leaves
#                as text: no task texts, emails or ids)
#   mode=deploy  tests, then back up, sync server/, pip, alembic, restart heli-bot-api,
#                health check; rolls back by itself if the API does not come up
# getheli.ru (/opt/heli), nginx and certificates on the same host are never touched.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "diff = only show differences, learning-check = read-only learning signals check, deploy = install"
        type: choice
        options: [diff, learning-check, deploy]
        default: diff
      amo_sandbox_hosts:
        description: "Учебные аккаунты amoCRM → HELI_AMO_SANDBOX_HOSTS (через запятую, xxx.amocrm.ru). Пусто — не менять."
        type: string
        default: ""
      ga4_sandbox_ids:
        description: "Учебные Measurement ID GA4 → HELI_GA4_SANDBOX_IDS (через запятую, G-…). Пусто — не менять."
        type: string
        default: ""
      docs_crawl:
        description: "Справочник официальных документов раз в сутки → HELI_DOCS_CRAWL (1 включить, 0 выключить). Пусто — не менять."
        type: choice
        options: ["", "1", "0"]
        default: ""
      paid_signup:
        description: "Платная регистрация: 1 = свободная регистрация + пробная неделя и тарифы (HELI_INVITE_ONLY=0, HELI_BILLING=1), 0 = обратно по приглашениям без тарифов. Пусто — не менять."
        type: choice
        options: ["", "1", "0"]
        default: ""
      admin_emails:
        description: "Почты админов → HELI_ADMIN_EMAILS (через запятую; заменяет список целиком). Пусто — не менять."
        type: string
        default: ""
  pull_request:
    paths:
      - "infra/deploy/pinvds/**"
      - ".github/workflows/deploy-pinvds.yml"

concurrency:
  group: heli-pinvds-deploy
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the host script
        run: bash -n infra/deploy/pinvds/deploy.sh

  server-tests:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server
        run: python -m pip install -e "./server[dev]"
      - name: Test
        env:
          HELI_API_KEY: ${{ secrets.HELI_API_KEY }}
        run: python -m pytest -q server/tests

  pinvds:
    if: github.event_name == 'workflow_dispatch' && !failure() && !cancelled()
    needs: [validate, server-tests]
    runs-on: ubuntu-latest
    environment: pinvds
    env:
      MODE: ${{ inputs.mode }}
      SSH_HOST: ${{ secrets.PINVDS_SSH_HOST }}
      SSH_USER: ${{ secrets.PINVDS_SSH_USER }}
      SSH_PORT: ${{ secrets.PINVDS_SSH_PORT || '22' }}
      AMO_HOSTS: ${{ inputs.amo_sandbox_hosts }}
      GA4_IDS: ${{ inputs.ga4_sandbox_ids }}
      ADMIN_EMAILS: ${{ inputs.admin_emails }}
      DOCS_CRAWL: ${{ inputs.docs_crawl }}
      PAID_SIGNUP: ${{ inputs.paid_signup }}
    steps:
      - uses: actions/checkout@v4

      - name: Check training-stand inputs
        run: |
          set -eu
          AMO_HOSTS="$(printf '%s' "$AMO_HOSTS" | tr -d ' ' | tr 'A-Z' 'a-z')"
          GA4_IDS="$(printf '%s' "$GA4_IDS" | tr -d ' ' | tr 'a-z' 'A-Z')"
          host='[a-z0-9-]+\.(amocrm\.(ru|com)|kommo\.com)'
          if [ -n "$AMO_HOSTS" ] && ! printf '%s' "$AMO_HOSTS" | grep -Eq "^$host(,$host)*$"; then
            echo "amo_sandbox_hosts: нужен адрес вида xxx.amocrm.ru (через запятую)"; exit 1; fi
          if [ -n "$GA4_IDS" ] && ! printf '%s' "$GA4_IDS" | grep -Eq '^G-[A-Z0-9]{4,16}(,G-[A-Z0-9]{4,16})*$'; then
            echo "ga4_sandbox_ids: нужен Measurement ID вида G-XXXXXXX (через запятую)"; exit 1; fi
          echo "AMO_HOSTS=$AMO_HOSTS" >> "$GITHUB_ENV"
          # Open sign-up only together with plans: without HELI_BILLING a new account would get the old free limits.
          case "${PAID_SIGNUP:-}" in
            1) echo "INVITE_ONLY=0" >> "$GITHUB_ENV"; echo "BILLING=1" >> "$GITHUB_ENV" ;;
            0) echo "INVITE_ONLY=1" >> "$GITHUB_ENV"; echo "BILLING=0" >> "$GITHUB_ENV" ;;
            *) echo "INVITE_ONLY=" >> "$GITHUB_ENV"; echo "BILLING=" >> "$GITHUB_ENV" ;;
          esac
          ADMIN_EMAILS="$(printf '%s' "$ADMIN_EMAILS" | tr -d ' ' | tr 'A-Z' 'a-z')"
          mail='[a-z0-9._+-]+@[a-z0-9-]+(\.[a-z0-9-]+)+'
          if [ -n "$ADMIN_EMAILS" ] && ! printf '%s' "$ADMIN_EMAILS" | grep -Eq "^$mail(,$mail)*$"; then
            echo "admin_emails: нужна почта вида name@example.ru (через запятую)"; exit 1; fi
          echo "GA4_IDS=$GA4_IDS" >> "$GITHUB_ENV"
          echo "ADMIN_EMAILS=$ADMIN_EMAILS" >> "$GITHUB_ENV"

      - name: Pack the release
        run: |
          set -eu
          echo "${GITHUB_SHA} ${GITHUB_REF_NAME} $(date -u +%Y-%m-%dT%H:%M:%SZ)" > server/REVISION
          tar -czf heli-bot-server.tgz --exclude='__pycache__' --exclude='*.egg-info' --exclude='.pytest_cache' server infra/deploy
          ls -l heli-bot-server.tgz

      - name: SSH key and pinned host key
        env:
          SSH_KEY: ${{ secrets.PINVDS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PINVDS_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          test -n "$SSH_HOST" && test -n "$SSH_USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" \
            || { echo "Missing PINVDS_SSH_HOST / PINVDS_SSH_USER / PINVDS_SSH_KEY / PINVDS_SSH_KNOWN_HOSTS secrets"; exit 1; }
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/pinvds && chmod 600 ~/.ssh/pinvds
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
          printf 'Host pinvds\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/pinvds\n  StrictHostKeyChecking yes\n  BatchMode yes\n' \
            "$SSH_HOST" "$SSH_USER" "$SSH_PORT" > ~/.ssh/config

      - name: Copy release and script
        run: |
          set -eu
          scp -q heli-bot-server.tgz infra/deploy/pinvds/deploy.sh pinvds:/tmp/
          ssh pinvds 'chmod +x /tmp/deploy.sh'

      - name: ${{ inputs.mode }}
        run: ssh pinvds "SET_HELI_AMO_SANDBOX_HOSTS='$AMO_HOSTS' SET_HELI_GA4_SANDBOX_IDS='$GA4_IDS' SET_HELI_ADMIN_EMAILS='$ADMIN_EMAILS' SET_HELI_DOCS_CRAWL='$DOCS_CRAWL' SET_HELI_INVITE_ONLY='$INVITE_ONLY' SET_HELI_BILLING='$BILLING' bash /tmp/deploy.sh '$MODE' /tmp/heli-bot-server.tgz; rc=\$?; rm -f /tmp/heli-bot-server.tgz /tmp/deploy.sh; exit \$rc"
